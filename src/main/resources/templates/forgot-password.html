<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oubliÃ© â€” SRM</title>
  <link rel="stylesheet" th:href="@{/css/style.css(v=5)}">
</head>
<body>
  <div class="page-wrapper">
    <header class="page-header">
      <a th:href="@{/}" class="page-header__logo">
        <img th:src="@{/logo/SRM_logo-removebg-preview.png}" alt="SRM" class="page-header__logo-img" />
      </a>
      <nav class="page-header__nav--inline">
        <a th:href="@{/home/login}" class="btn btn--outline btn--sm">Retour &agrave; la connexion</a>
      </nav>
    </header>

    <main class="page-main">
      <div class="card">
        <h1>Mot de passe oubli&eacute;</h1>
        <p class="subtitle">Saisissez votre email pour recevoir un lien de r&eacute;initialisation</p>

        <div th:if="${sent}" class="alert alert--success">
          Un email de r&eacute;initialisation vient de vous &ecirc;tre envoy&eacute;. V&eacute;rifiez votre bo&icirc;te de r&eacute;ception.
        </div>

        <div th:if="${error}" class="alert alert--error" th:text="${error}">Erreur</div>

        <form method="post" th:action="@{/home/forgot-password}" novalidate id="forgotForm" th:unless="${sent}">
          <div class="form-group">
            <label for="email" class="form-label">Adresse email <span class="required">*</span></label>
            <input type="email" id="email" name="email" class="form-input" required autocomplete="email" placeholder="vous@exemple.com" autofocus>
          </div>
          <button type="submit" class="btn btn--primary btn--full" id="submitBtn">Envoyer le lien</button>
        </form>
      </div>
    </main>

    <footer class="page-footer">
      &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> SRM
    </footer>
  </div>

  <script th:unless="${sent}">
    document.getElementById('forgotForm').addEventListener('submit', function() {
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('submitBtn').classList.add('btn--loading');
    });
  </script>
</body>
</html>
