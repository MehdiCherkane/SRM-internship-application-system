spring.application.name=internship

spring.datasource.url=jdbc:mysql://localhost:3306/internship_db
spring.datasource.username=${DB_USER:internship_app}
spring.datasource.password=${DB_PASSWORD:OneP!2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Serve every HTML response as UTF-8 before security and application filters run.
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

spring.web.locale=fr_FR
spring.web.locale-resolver=fixed

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:elmahdicherkane@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ymiq losm kfhw zwuf}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.upload-dir=./uploads
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.security.require-https=${APP_SECURITY_REQUIRE_HTTPS:false}

# Session hardening — set SESSION_COOKIE_SECURE=true in production (behind HTTPS)
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.max-age=30m
server.servlet.session.timeout=30m

server.error.include-exception=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
