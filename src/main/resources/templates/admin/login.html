<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — ONEP</title>
  <link rel="stylesheet" th:href="@{/css/style.css(v=3)}">
</head>
<body class="admin-layout">
  <div class="login-card">
    <div class="login-card__icon">
      <svg viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M17 2C17 2 5 16 5 24C5 30.5 10.5 33 17 33C23.5 33 29 30.5 29 24C29 16 17 2 17 2Z" fill="#0c4a6e"/>
        <path d="M17 4C17 4 7 17 7 24C7 29 11 32 17 32C23 32 27 29 27 24C27 17 17 4 17 4Z" fill="#f0f9ff" opacity="0.15"/>
        <path d="M11.5 24C13 22 15.5 21.5 17 23C18.5 24.5 21 25 23.5 24" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
        <path d="M17 2C17 2 5 16 5 24C5 30.5 10.5 33 17 33C23.5 33 29 30.5 29 24C29 16 17 2 17 2Z" stroke="#0c4a6e" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="login-card__title">Administration ONEP</div>
    <div class="login-card__subtitle">Portail de gestion des candidatures</div>

    <div th:if="${param.error}" class="alert alert--error">Identifiants incorrects. Veuillez réessayer.</div>
    <div th:if="${param.logout}" class="alert alert--success">Vous êtes déconnecté.</div>

    <form method="post" th:action="@{/admin/login}" novalidate id="loginForm">
      <div class="form-group">
        <label for="username" class="form-label">Nom d'utilisateur</label>
        <input type="text" id="username" name="username" class="form-input" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Mot de passe</label>
        <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn--primary btn--full">Se connecter</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      var btn = this.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.classList.add('btn--loading');
    });
  </script>
</body>
</html>
