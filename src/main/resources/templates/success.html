<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidature envoyée — SRM</title>
  <link rel="stylesheet" th:href="@{/css/style.css(v=7)}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="page-wrapper">
    <header class="page-header">
      <a th:href="@{/}" class="page-header__logo">
        <img th:src="@{/logo/SRM_logo-removebg-preview.png}" alt="SRM" class="page-header__logo-img" />
      </a>
    </header>

    <main class="page-main">
      <div class="card card--centered">
        <svg class="success-icon" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="28" fill="#d1fae5"/>
          <path d="M20 34l8 8 16-16" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <h1>Candidature reçue !</h1>
        <p class="subtitle" style="max-width:420px;margin-left:auto;margin-right:auto;">
          Merci pour votre candidature. Notre équipe examinera votre dossier et vous recevrez une notification par email dès qu'une décision sera prise.
        </p>

        <div class="success-actions">
          <a th:href="@{/applicant/dashboard}" class="btn btn--primary btn--full" style="margin-bottom:0.75rem;">
            <i class="fa-solid fa-list-check" aria-hidden="true"></i> Voir mes candidatures
          </a>
          <a th:href="@{/}" class="btn btn--outline btn--full">
            <i class="fa-solid fa-house" aria-hidden="true"></i> Retour à l'accueil
          </a>
        </div>
      </div>
    </main>

    <footer class="page-footer">
      &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> SRM STAGE Khénifra. Tous droits réservés.
    </footer>
  </div>
</body>
</html>
